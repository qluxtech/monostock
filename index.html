<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONOSTOCK — Autonomous Global Economy Fabric</title>
    <style>
        :root {
            --bg-base: #030305;
            --surface-glass: rgba(12, 12, 18, 0.9);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(0, 255, 204, 0.7);
            --neon-cyan: #00ffcc;
            --neon-blue: #0066ff;
            --text-main: #f4f4f8;
            --text-muted: #8b8b9e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 204, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(0, 102, 255, 0.06) 0%, transparent 40%);
        }

        header {
            padding: 1.2rem 1rem;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(3, 3, 5, 0.95);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fff 20%, var(--neon-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-status {
            font-size: 0.65rem;
            color: var(--neon-cyan);
            background: rgba(0, 255, 204, 0.12);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            font-family: monospace;
            font-weight: 700;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.2rem 1rem;
        }

        /* 👑 【顔】最上部メインステージ：グローバルマーケット一覧 */
        .card-main-market {
            background: linear-gradient(135deg, rgba(12, 22, 35, 0.98) 0%, rgba(8, 12, 20, 0.98) 100%);
            border: 2px solid var(--border-active);
            border-radius: 18px;
            padding: 1.8rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 16px 50px rgba(0, 255, 204, 0.25);
        }

        .market-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--neon-cyan);
            margin: 0 0 0.4rem 0;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .market-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0 0 1.2rem 0;
            line-height: 1.5;
        }

        .card {
            background: var(--surface-glass);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 1.4rem;
            margin-bottom: 1.2rem;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 0.3rem 0;
        }

        .card-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0 0 1rem 0;
        }
